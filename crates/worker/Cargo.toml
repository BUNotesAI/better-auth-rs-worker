[package]
name = "better-auth-worker"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Cloudflare Worker adapter boundary for better-auth"
repository = { workspace = true }

[dependencies]
async-trait = { workspace = true }
better-auth-api = { workspace = true, default-features = false, optional = true }
better-auth-core = { workspace = true, default-features = false }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { workspace = true }

[features]
default = []
api-route-tests = ["dep:better-auth-api"]
local-futures = ["better-auth-core/local-futures", "better-auth-api?/local-futures"]
oidc-provider = ["better-auth-core/oidc-provider", "better-auth-api?/oidc-provider"]
# Portable ES256 signer (pure Rust p256) for the Worker OIDC id_token signing path.
# The wasm binary must also enable `getrandom/js` (p256 pulls getrandom).
p256-signer = ["better-auth-core/p256-signer", "oidc-provider"]
