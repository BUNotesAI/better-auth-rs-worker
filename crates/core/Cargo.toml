[package]
name = "better-auth-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Core abstractions for better-auth: traits, types, config, error handling"
repository = { workspace = true }

[dependencies]
# Asynchronous runtime
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Validation
validator = { workspace = true }

# Time handling
chrono = { workspace = true }

# Data structures
uuid = { workspace = true, optional = true }

# Cookie parsing
cookie = { workspace = true }

# Pattern matching
glob-match = "0.2.1"
# Crypto
argon2 = { workspace = true, optional = true }
password-hash = { version = "0.5", optional = true, features = ["getrandom"] }
base64 = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
# Portable ES256 signing (pure Rust, wasm-friendly, no ring/openssl)
p256 = { version = "0.13", optional = true }

# Database (optional)
sqlx = { workspace = true, optional = true }

# Cache (optional)
redis = { workspace = true, optional = true }

# Derive macros (optional)
better-auth-derive = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
http-body-util = { version = "0.1", optional = true }
url = { workspace = true }
idna = "1"
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = []
local-futures = []
derive = ["dep:better-auth-derive"]
jwt = ["dep:jsonwebtoken"]
oidc-provider = []
# Portable ES256 JwtSigner (pure Rust p256/ecdsa; works on native and wasm/Worker)
p256-signer = ["dep:p256", "oidc-provider"]
password-argon2 = ["dep:argon2", "dep:password-hash"]
native-id = ["dep:uuid", "uuid/v4"]
sqlx-postgres = ["dep:sqlx", "native-id"]
redis-cache = ["dep:redis"]
axum = ["dep:axum", "dep:http-body-util"]
